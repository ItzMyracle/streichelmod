name: Build mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0

      # findet den Ordner mit build.gradle (egal ob im Hauptordner oder in einem Unterordner)
      - name: Projektordner finden
        id: find
        run: |
          FILE=$(find . -maxdepth 3 -name build.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$FILE" ]; then echo "build.gradle nicht gefunden"; exit 1; fi
          DIR=$(dirname "$FILE")
          echo "Projektordner: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Mod bauen
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: streichelmod-jar
          path: |
            ${{ steps.find.outputs.dir }}/build/libs/*.jar
            !${{ steps.find.outputs.dir }}/build/libs/*-sources.jar
